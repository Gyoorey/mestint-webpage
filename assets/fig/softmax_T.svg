  <text x="34.0" y="232.0" class="lbl">At T = 1 the teacher says only "stop". At T = 4 it says "stop, and it is much more like up and off</text>
  <text x="34.0" y="250.0" class="lbl">than like dog" — a similarity metric the one-hot label never contained.</text>
  <text x="34.0" y="276.0" class="lblb">That extra structure is the dark knowledge. It is also why the loss needs the T² correction:</text>
  <text x="34.0" y="294.0" class="lblb">softening shrinks the gradient by about 1/T², and the factor puts it back.</text>
