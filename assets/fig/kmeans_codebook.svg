  <text x="56.0" y="34.0" class="lbl">4 centroids  (the codebook)</text>
  <text x="56.0" y="136.0" class="lbl">16 original float32 weights</text>
  <text x="56.0" y="176.0" class="lblb">before:  16 × 32 bits = 512 bits</text>
  <text x="56.0" y="198.0" class="lblb" fill="var(--copper)">after:   16 × 2 bits + 4 × 32 bits = 160 bits</text>
  <text x="56.0" y="220.0" class="lbl">→ 3.2× smaller in flash</text>
  <text x="392.0" y="176.0" class="lbl">But at inference the indices must be</text>
  <text x="392.0" y="194.0" class="lbl">decoded back to values before the</text>
  <text x="392.0" y="212.0" class="lbl">multiply. Storage compression is not</text>
  <text x="392.0" y="230.0" class="lblb" fill="var(--copper)">runtime compression.</text>
  <text x="56.0" y="262.0" class="lbl">Gradients of all weights sharing a centroid are summed to update that centroid during fine-tuning.</text>
