<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="Course map: the embedded ML pipeline from sensor to deployed model, with each stage labelled by the sessions that cover it"><style>text{fill:#14181A}svg{color:#14181A;font-family:"IBM Plex Sans Condensed",Arial,sans-serif}.acc{stroke:#A6512A;fill:none}.accf{fill:#A6512A}.tl{stroke:#255C61;fill:none}.tlf{fill:#255C61}.ax{stroke:currentColor;stroke-width:1.1;fill:none}.grid{stroke:currentColor;stroke-width:.6;opacity:.22;fill:none}.ser{fill:none;stroke:currentColor;stroke-width:1.8}.lbl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;fill:currentColor;opacity:.75}.lblb{font-family:"IBM Plex Sans Condensed",Arial,sans-serif;font-size:12px;font-weight:600;fill:currentColor}.fillsoft{fill:currentColor;opacity:.14}text.accf{fill:#A6512A;opacity:1}text.tlf{fill:#255C61;opacity:1}</style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g font-family="IBM Plex Sans Condensed, sans-serif" font-size="13" fill="currentColor">
    <!-- pipeline row -->
    <g stroke="currentColor" stroke-width="1.2" fill="none">
      <rect x="8" y="52" width="120" height="52"/>
      <rect x="158" y="52" width="120" height="52"/>
      <rect x="308" y="52" width="120" height="52"/>
      <rect x="458" y="52" width="120" height="52"/>
      <rect x="608" y="52" width="104" height="52"/>
    </g>
    <text x="68" y="74" text-anchor="middle" font-weight="600">Sensor &amp;</text>
    <text x="68" y="90" text-anchor="middle" font-weight="600">signal chain</text>
    <text x="218" y="74" text-anchor="middle" font-weight="600">Representation</text>
    <text x="218" y="90" text-anchor="middle" font-weight="600">&amp; features</text>
    <text x="368" y="74" text-anchor="middle" font-weight="600">Model</text>
    <text x="368" y="90" text-anchor="middle" font-weight="600">family</text>
    <text x="518" y="74" text-anchor="middle" font-weight="600">Compression</text>
    <text x="518" y="90" text-anchor="middle" font-weight="600">&amp; search</text>
    <text x="660" y="74" text-anchor="middle" font-weight="600">Compile &amp;</text>
    <text x="660" y="90" text-anchor="middle" font-weight="600">deploy</text>
    <g stroke="currentColor" stroke-width="1.2" marker-end="url(#ar)">
      <line x1="128" y1="78" x2="152" y2="78"/>
      <line x1="278" y1="78" x2="302" y2="78"/>
      <line x1="428" y1="78" x2="452" y2="78"/>
      <line x1="578" y1="78" x2="602" y2="78"/>
    </g>
    <!-- session labels -->
    <g font-family="IBM Plex Mono, monospace" font-size="11" fill="currentColor" opacity="0.72">
      <text x="68" y="122" text-anchor="middle">Session 2</text>
      <text x="218" y="122" text-anchor="middle">Session 3</text>
      <text x="368" y="122" text-anchor="middle">Sessions 4–5, 12</text>
      <text x="518" y="122" text-anchor="middle">Sessions 8–11</text>
      <text x="660" y="122" text-anchor="middle">Sessions 13–14</text>
    </g>
    <!-- hardware band -->
    <rect x="8" y="150" width="704" height="44" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="360" y="170" text-anchor="middle" font-weight="600">Hardware substrate — CPU · MCU · DSP · GPU · NPU · FPGA · analog</text>
    <text x="360" y="187" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" opacity="0.72">Sessions 6–7: every stage above is priced against this row</text>
    <!-- constraint band -->
    <rect x="8" y="14" width="704" height="26" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="360" y="32" text-anchor="middle" font-weight="600">Constraint budget — SRAM · flash · latency · energy per inference · unit cost</text>
    <g stroke="currentColor" stroke-width="1" opacity="0.5">
      <line x1="360" y1="40" x2="360" y2="52"/>
      <line x1="360" y1="104" x2="360" y2="150"/>
    </g>
    <text x="360" y="222" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" opacity="0.72">Session 1 sets the budget · Session 14 closes the loop with measurement and drift</text>
  </g>
</svg>