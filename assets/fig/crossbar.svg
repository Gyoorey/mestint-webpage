  <text x="150.0" y="34.0" class="lbl" fill="var(--copper)">conductance G_ij stores the weight</text>
  <text x="24.0" y="254.0" class="lblb">Ohm:      I_ij = V_i · G_ij</text>
  <text x="24.0" y="274.0" class="lblb">Kirchhoff: I_j = Σ_i V_i · G_ij</text>
  <text x="24.0" y="294.0" class="lbl" fill="var(--copper)">one matrix–vector product, one step, weights never move</text>
  <text x="392.0" y="272.0" class="lbl">But: the ADCs at the bottom dominate the energy,</text>
  <text x="392.0" y="288.0" class="lbl">conductances drift with time and temperature,</text>
  <text x="392.0" y="304.0" class="lbl">writes are slow and wear the device, and the</text>
  <text x="392.0" y="320.0" class="lbl">effective precision is a few bits.</text>
