  <text x="88.0" y="203.6" class="lbl" text-anchor="end">0</text>
  <line x1="96.0" y1="161.0" x2="560.0" y2="161.0" class="grid"/>
  <line x1="92.0" y1="161.0" x2="96.0" y2="161.0" class="ax"/>
  <text x="88.0" y="164.6" class="lbl" text-anchor="end">250 kB</text>
  <line x1="96.0" y1="122.0" x2="560.0" y2="122.0" class="grid"/>
  <line x1="92.0" y1="122.0" x2="96.0" y2="122.0" class="ax"/>
  <text x="88.0" y="125.6" class="lbl" text-anchor="end">500 kB</text>
  <line x1="96.0" y1="83.0" x2="560.0" y2="83.0" class="grid"/>
  <line x1="92.0" y1="83.0" x2="96.0" y2="83.0" class="ax"/>
  <text x="88.0" y="86.6" class="lbl" text-anchor="end">750 kB</text>
  <line x1="96.0" y1="44.0" x2="560.0" y2="44.0" class="grid"/>
  <line x1="92.0" y1="44.0" x2="96.0" y2="44.0" class="ax"/>
  <text x="88.0" y="47.6" class="lbl" text-anchor="end">1 MB</text>
  <rect x="122.5" y="180.0" width="54.0" height="20.0" class="tlf" opacity="0.55"/>
  <text x="149.5" y="172.0" class="lblb" text-anchor="middle">128 kB</text>
  <text x="149.5" y="216.0" class="lbl" text-anchor="middle">inference</text>
  <rect x="211.8" y="180.0" width="54.0" height="20.0" class="tlf" opacity="0.55"/>
  <rect x="211.8" y="61.5" width="54.0" height="118.6" class="accf" opacity="0.75"/>
  <rect x="211.8" y="41.5" width="54.0" height="20.0" fill="currentColor" opacity="0.4"/>
  <text x="238.8" y="33.5" class="lblb" text-anchor="middle">1016 kB</text>
  <text x="238.8" y="216.0" class="lbl" text-anchor="middle">full backprop</text>
  <rect x="301.0" y="180.0" width="54.0" height="20.0" class="tlf" opacity="0.55"/>
  <rect x="301.0" y="173.8" width="54.0" height="6.2" class="accf" opacity="0.75"/>
  <rect x="301.0" y="172.5" width="54.0" height="1.2" fill="currentColor" opacity="0.4"/>
  <text x="328.0" y="164.5" class="lblb" text-anchor="middle">176 kB</text>
  <text x="328.0" y="216.0" class="lbl" text-anchor="middle">last layer</text>
  <rect x="390.2" y="180.0" width="54.0" height="20.0" class="tlf" opacity="0.55"/>
  <rect x="390.2" y="165.1" width="54.0" height="15.0" class="accf" opacity="0.75"/>
