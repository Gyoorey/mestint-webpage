  <text x="417.2" y="216.0" class="lbl" text-anchor="middle">bias + BN</text>
  <rect x="479.5" y="180.0" width="54.0" height="20.0" class="tlf" opacity="0.55"/>
  <rect x="479.5" y="147.3" width="54.0" height="32.8" class="accf" opacity="0.75"/>
