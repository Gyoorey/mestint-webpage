  <text x="506.5" y="134.0" class="lblb" text-anchor="middle">372 kB</text>
  <text x="506.5" y="216.0" class="lbl" text-anchor="middle">sparse update</text>
  <line x1="96.0" y1="160.1" x2="560.0" y2="160.1" class="acc" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="566.0" y="164.1" class="lblb" fill="var(--copper)">256 kB SRAM</text>
  <rect x="566.0" y="60.0" width="12.0" height="12.0" class="tlf" opacity="0.55"/>
  <text x="584.0" y="70.0" class="lbl">weights</text>
  <rect x="566.0" y="82.0" width="12.0" height="12.0" class="accf" opacity="0.75"/>
  <text x="584.0" y="92.0" class="lbl">stored activations</text>
  <rect x="566.0" y="104.0" width="12.0" height="12.0" fill="currentColor" opacity="0.4"/>
  <text x="584.0" y="114.0" class="lbl">gradients</text>
  <text x="96.0" y="250.0" class="lbl">Backpropagation must keep every forward activation until its gradient is used —</text>
  <text x="96.0" y="268.0" class="lbl">so training memory is set by the activations, not by the parameter count.</text>
  <text x="96.0" y="288.0" class="lblb" fill="var(--copper)">Every practical on-device-training method is a way of storing fewer activations.</text>
</svg>