  <text x="478.0" y="24.4" class="lblb" fill="var(--copper)">3×3 dilated ×2</text>
  <text x="268.0" y="236.0" class="lbl" text-anchor="middle">layer index</text>
  <text x="24.0" y="117.0" class="lbl" text-anchor="middle" transform="rotate(-90 24.0 117.0)">receptive field (samples)</text>
  <text x="66.0" y="24.0" class="lblb">R_i = R_{i−1} + (k_i − 1) · d_i · Π s_j</text>
  <text x="66.0" y="252.0" class="lblb">A receptive field shorter than the event cannot detect it.</text>
  <text x="66.0" y="272.0" class="lbl">At 16 kHz with a 128-sample hop, 10 dilated layers already span about 2 seconds of audio.</text>
