  <text x="360.0" y="38.0" class="lbl" text-anchor="middle">per-sensor encoders, joint head</text>
  <text x="600.0" y="22.0" class="lblb" text-anchor="middle">Late (decision) fusion</text>
  <text x="600.0" y="38.0" class="lbl" text-anchor="middle">per-sensor models, vote / average</text>
