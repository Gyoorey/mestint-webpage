  <text x="66.0" y="68.2" class="lbl" text-anchor="end">10 GB</text>
  <rect x="74.0" y="161.7" width="271.4" height="74.3" class="fillsoft"/>
  <text x="81.2" y="152.7" class="lblb" fill="var(--copper)">the tinyML region</text>
  <circle cx="97.6" cy="222.4" r="5.0" class="accf" opacity="0.85"/>
  <text x="108.6" y="226.4" class="lblb">sensor front end</text>
