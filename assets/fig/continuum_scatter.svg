  <text x="414.8" y="63.9" class="lblb" text-anchor="end">embedded module</text>
  <circle cx="497.4" cy="38.8" r="11.0" fill="currentColor" opacity="0.85"/>
  <text x="480.4" y="42.8" class="lblb" text-anchor="end">datacentre GPU</text>
  <text x="297.0" y="272.0" class="lbl" text-anchor="middle">typical active power</text>
  <text x="26.0" y="136.0" class="lbl" text-anchor="middle" transform="rotate(-90 26.0 136.0)">addressable memory</text>
  <text x="74.0" y="26.0" class="lbl">six orders of magnitude of power, seven of memory</text>
  <text x="74.0" y="300.0" class="lblb">"Small" is never absolute — it is relative to one point on this plane.</text>
</svg>