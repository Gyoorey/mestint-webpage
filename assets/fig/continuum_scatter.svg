  <line x1="173.1" y1="36.0" x2="173.1" y2="236.0" class="grid"/>
  <line x1="173.1" y1="236.0" x2="173.1" y2="240.0" class="ax"/>
  <text x="173.1" y="253.0" class="lbl" text-anchor="middle">100 µW</text>
  <line x1="272.2" y1="36.0" x2="272.2" y2="236.0" class="grid"/>
  <line x1="272.2" y1="236.0" x2="272.2" y2="240.0" class="ax"/>
  <text x="272.2" y="253.0" class="lbl" text-anchor="middle">10 mW</text>
  <line x1="371.3" y1="36.0" x2="371.3" y2="236.0" class="grid"/>
  <line x1="371.3" y1="236.0" x2="371.3" y2="240.0" class="ax"/>
  <text x="371.3" y="253.0" class="lbl" text-anchor="middle">1 W</text>
  <line x1="470.4" y1="36.0" x2="470.4" y2="236.0" class="grid"/>
  <line x1="470.4" y1="236.0" x2="470.4" y2="240.0" class="ax"/>
  <text x="470.4" y="253.0" class="lbl" text-anchor="middle">100 W</text>
  <line x1="74.0" y1="236.0" x2="520.0" y2="236.0" class="grid"/>
  <line x1="70.0" y1="236.0" x2="74.0" y2="236.0" class="ax"/>
  <text x="66.0" y="239.6" class="lbl" text-anchor="end">16 kB</text>
  <line x1="74.0" y1="178.9" x2="520.0" y2="178.9" class="grid"/>
  <line x1="70.0" y1="178.9" x2="74.0" y2="178.9" class="ax"/>
  <text x="66.0" y="182.5" class="lbl" text-anchor="end">1 MB</text>
  <line x1="74.0" y1="121.7" x2="520.0" y2="121.7" class="grid"/>
  <line x1="70.0" y1="121.7" x2="74.0" y2="121.7" class="ax"/>
  <text x="66.0" y="125.3" class="lbl" text-anchor="end">100 MB</text>
  <line x1="74.0" y1="64.6" x2="520.0" y2="64.6" class="grid"/>
