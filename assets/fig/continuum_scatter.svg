  <text x="263.6" y="197.8" class="lblb" text-anchor="end">MCU · M4F</text>
  <circle cx="310.8" cy="176.6" r="7.0" class="accf" opacity="0.85"/>
  <text x="323.8" y="180.6" class="lblb">MCU · M7</text>
  <circle cx="331.9" cy="165.2" r="7.5" class="accf" opacity="0.85"/>
  <text x="318.4" y="169.2" class="lblb" text-anchor="end">MCU + microNPU</text>
  <circle cx="395.0" cy="75.9" r="9.0" fill="currentColor" opacity="0.85"/>
