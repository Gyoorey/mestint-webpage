  <text x="377.9" y="239.0" class="lbl">crossover: task-dependent</text>
  <text x="166.0" y="97.0" class="lblb tlf">features + SVM / trees</text>
  <text x="337.4" y="206.0" class="lblb accf">deep network on raw input</text>
  <text x="480.0" y="50.0" class="lblb">Choose classical when</text>
  <text x="486.0" y="70.0" class="lbl">· labels are few or costly</text>
  <text x="486.0" y="86.0" class="lbl">· good features are known</text>
  <text x="486.0" y="102.0" class="lbl">· the budget is a few kB</text>
  <text x="486.0" y="118.0" class="lbl">· you must explain decisions</text>
  <text x="480.0" y="150.0" class="lblb">Choose deep when</text>
  <text x="486.0" y="170.0" class="lbl">· data is plentiful</text>
  <text x="486.0" y="186.0" class="lbl">· signals are raw, high-dim.</text>
  <text x="486.0" y="202.0" class="lbl">· (images, audio, multi-axis)</text>
  <text x="486.0" y="218.0" class="lbl">· an NPU or SIMD path exists</text>
  <text x="70.0" y="308.0" class="lbl">Schematic, not measured: the shape is typical, the numbers are not.</text>
