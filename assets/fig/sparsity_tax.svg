<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="Three weight matrices showing unstructured sparsity as scattered removed entries, N to M sparsity as two of every four entries removed within each group, and structured sparsity as whole columns removed, with the resulting hardware benefit annotated under each"><style>text{fill:#14181A}svg{color:#14181A;font-family:"IBM Plex Sans Condensed",Arial,sans-serif}.acc{stroke:#A6512A;fill:none}.accf{fill:#A6512A}.tl{stroke:#255C61;fill:none}.tlf{fill:#255C61}.ax{stroke:currentColor;stroke-width:1.1;fill:none}.grid{stroke:currentColor;stroke-width:.6;opacity:.22;fill:none}.ser{fill:none;stroke:currentColor;stroke-width:1.8}.lbl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;fill:currentColor;opacity:.75}.lblb{font-family:"IBM Plex Sans Condensed",Arial,sans-serif;font-size:12px;font-weight:600;fill:currentColor}.fillsoft{fill:currentColor;opacity:.14}text.accf{fill:#A6512A;opacity:1}text.tlf{fill:#255C61;opacity:1}</style>
  <g font-family="IBM Plex Sans Condensed, sans-serif" font-size="12" fill="currentColor">
    <!-- unstructured -->
    <text x="102" y="20" text-anchor="middle" font-weight="600">Unstructured</text>
    <g stroke="currentColor" stroke-width="0.7" opacity="0.55" fill="none">
      <rect x="30" y="32" width="144" height="144"/>
      <line x1="30" y1="68" x2="174" y2="68"/><line x1="30" y1="104" x2="174" y2="104"/><line x1="30" y1="140" x2="174" y2="140"/>
      <line x1="66" y1="32" x2="66" y2="176"/><line x1="102" y1="32" x2="102" y2="176"/><line x1="138" y1="32" x2="138" y2="176"/>
    </g>
    <g fill="currentColor" opacity="0.35">
      <rect x="30" y="32" width="36" height="36"/><rect x="102" y="32" width="36" height="36"/>
      <rect x="66" y="68" width="36" height="36"/><rect x="138" y="68" width="36" height="36"/>
      <rect x="30" y="104" width="36" height="36"/><rect x="102" y="104" width="36" height="36"/>
      <rect x="66" y="140" width="36" height="36"/><rect x="102" y="140" width="36" height="36"/>
    </g>
    <text x="102" y="198" text-anchor="middle" font-family="IBM Plex Mono, monospace" opacity="0.8" font-size="9.46">highest accuracy per weight removed</text>
    <text x="102" y="214" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" class="accf">needs indices; rarely faster</text>

    <!-- N:M -->
    <text x="332" y="20" text-anchor="middle" font-weight="600">2:4 semi-structured</text>
    <g stroke="currentColor" stroke-width="0.7" opacity="0.55" fill="none">
      <rect x="260" y="32" width="144" height="144"/>
      <line x1="260" y1="68" x2="404" y2="68"/><line x1="260" y1="104" x2="404" y2="104"/><line x1="260" y1="140" x2="404" y2="140"/>
      <line x1="296" y1="32" x2="296" y2="176"/><line x1="332" y1="32" x2="332" y2="176"/><line x1="368" y1="32" x2="368" y2="176"/>
    </g>
    <g fill="currentColor" opacity="0.35">
      <rect x="260" y="32" width="36" height="36"/><rect x="332" y="32" width="36" height="36"/>
      <rect x="296" y="68" width="36" height="36"/><rect x="368" y="68" width="36" height="36"/>
      <rect x="260" y="104" width="36" height="36"/><rect x="368" y="104" width="36" height="36"/>
      <rect x="296" y="140" width="36" height="36"/><rect x="332" y="140" width="36" height="36"/>
    </g>
    <g class="acc" stroke-width="1.6" fill="none">
      <rect x="260" y="32" width="144" height="36"/>
    </g>
    <text x="416" y="54" font-family="IBM Plex Mono, monospace" font-size="10.5" class="accf">exactly 2 of every 4</text>
    <text x="332" y="198" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" opacity="0.8">fixed pattern, small metadata</text>
    <text x="332" y="214" text-anchor="middle" font-family="IBM Plex Mono, monospace" class="tlf" font-size="9.7">real speedup where hardware supports it</text>

    <!-- structured -->
    <text x="562" y="20" text-anchor="middle" font-weight="600">Structured (channels)</text>
    <g stroke="currentColor" stroke-width="0.7" opacity="0.55" fill="none">
      <rect x="490" y="32" width="144" height="144"/>
      <line x1="490" y1="68" x2="634" y2="68"/><line x1="490" y1="104" x2="634" y2="104"/><line x1="490" y1="140" x2="634" y2="140"/>
      <line x1="526" y1="32" x2="526" y2="176"/><line x1="562" y1="32" x2="562" y2="176"/><line x1="598" y1="32" x2="598" y2="176"/>
    </g>
    <g fill="currentColor" opacity="0.35">
      <rect x="526" y="32" width="36" height="144"/><rect x="598" y="32" width="36" height="144"/>
    </g>
    <text x="562" y="198" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" opacity="0.8">result is a smaller <tspan font-weight="600">dense</tspan> network</text>
    <text x="562" y="214" text-anchor="middle" font-family="IBM Plex Mono, monospace" class="tlf" font-size="9.7">speedup everywhere, no special support</text>

    <text x="360" y="242" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="12.5" font-weight="600">Accuracy per removed weight falls left to right. Realised speedup rises left to right. Choose by which you are short of.</text>
  </g>
</svg>