  <text x="66.0" y="316.0" class="lblb">Five years of architecture work bought roughly an order of magnitude, at constant accuracy.</text>
  <text x="66.0" y="336.0" class="lbl">Note the axis convention problem: these papers count MAdds, FLOPs and "ops" and do not always agree.</text>
  <text x="66.0" y="354.0" class="lbl">Always check which one a number is before comparing across papers.</text>
