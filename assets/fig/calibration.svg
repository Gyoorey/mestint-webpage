  <text x="360.0" y="66.0" class="lblb" fill="var(--copper)">boosted ensemble</text>
  <text x="360.0" y="82.0" class="lbl">pushes scores to 0 and 1</text>
  <text x="360.0" y="112.0" class="lblb" fill="var(--teal)">random forest</text>
  <text x="360.0" y="128.0" class="lbl">averaging pulls them to 0.5</text>
  <text x="360.0" y="160.0" class="lbl">Neither is wrong about ranking.</text>
