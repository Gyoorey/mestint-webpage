<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="Two spectra: adequate sampling with separated spectral replicas, and undersampling where replicas overlap and the overlapping region is highlighted as aliasing"><style>text{fill:#14181A}svg{color:#14181A;font-family:"IBM Plex Sans Condensed",Arial,sans-serif}.acc{stroke:#A6512A;fill:none}.accf{fill:#A6512A}.tl{stroke:#255C61;fill:none}.tlf{fill:#255C61}.ax{stroke:currentColor;stroke-width:1.1;fill:none}.grid{stroke:currentColor;stroke-width:.6;opacity:.22;fill:none}.ser{fill:none;stroke:currentColor;stroke-width:1.8}.lbl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;fill:currentColor;opacity:.75}.lblb{font-family:"IBM Plex Sans Condensed",Arial,sans-serif;font-size:12px;font-weight:600;fill:currentColor}.fillsoft{fill:currentColor;opacity:.14}text.accf{fill:#A6512A;opacity:1}text.tlf{fill:#255C61;opacity:1}</style>
  <g font-family="IBM Plex Sans Condensed, sans-serif" font-size="12" fill="currentColor">
    <!-- top: fs > 2B -->
    <text x="6" y="16" font-family="IBM Plex Mono, monospace" font-size="11" opacity="0.75">f_s &gt; 2B — replicas separated, baseband recoverable</text>
    <line x1="20" y1="96" x2="700" y2="96" stroke="currentColor" stroke-width="1.1"/>
    <g fill="none" stroke="currentColor" stroke-width="1.4">
      <path d="M120 96 L160 46 L200 96"/>
      <path d="M300 96 L340 46 L380 96"/>
      <path d="M480 96 L520 46 L560 96"/>
    </g>
    <g font-family="IBM Plex Mono, monospace" font-size="10.5" opacity="0.75" text-anchor="middle">
      <text x="160" y="112">baseband</text>
      <text x="340" y="112">f_s</text>
      <text x="520" y="112">2f_s</text>
    </g>
    <g stroke="currentColor" stroke-width="0.8" opacity="0.45" stroke-dasharray="3 3">
      <line x1="200" y1="40" x2="200" y2="96"/><line x1="300" y1="40" x2="300" y2="96"/>
    </g>
    <text x="250" y="38" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" opacity="0.75">guard band</text>

    <!-- bottom: fs below 2B -->
    <text x="6" y="152" font-family="IBM Plex Mono, monospace" font-size="11" opacity="0.75">f_s &lt; 2B — replicas overlap; the sum in the shaded band cannot be undone</text>
    <line x1="20" y1="232" x2="700" y2="232" stroke="currentColor" stroke-width="1.1"/>
    <g fill="none" stroke="currentColor" stroke-width="1.4">
      <path d="M100 232 L170 172 L240 232"/>
      <path d="M210 232 L280 172 L350 232"/>
      <path d="M320 232 L390 172 L460 232"/>
      <path d="M430 232 L500 172 L570 232"/>
    </g>
    <g class="accf" opacity="0.9">
      <path d="M210 232 L225 219 L240 232 Z"/>
      <path d="M320 232 L335 219 L350 232 Z"/>
      <path d="M430 232 L445 219 L460 232 Z"/>
    </g>
    <text x="225" y="252" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" class="accf">aliased energy</text>
  </g>
</svg>