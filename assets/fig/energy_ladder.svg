<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="Bar chart on a logarithmic scale comparing the energy of an 8-bit add, an 8-bit multiply, on-chip SRAM reads, a DRAM access, and a radio transmission of the same 32 bits"><style>text{fill:#14181A}svg{color:#14181A;font-family:"IBM Plex Sans Condensed",Arial,sans-serif}.acc{stroke:#A6512A;fill:none}.accf{fill:#A6512A}.tl{stroke:#255C61;fill:none}.tlf{fill:#255C61}.ax{stroke:currentColor;stroke-width:1.1;fill:none}.grid{stroke:currentColor;stroke-width:.6;opacity:.22;fill:none}.ser{fill:none;stroke:currentColor;stroke-width:1.8}.lbl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;fill:currentColor;opacity:.75}.lblb{font-family:"IBM Plex Sans Condensed",Arial,sans-serif;font-size:12px;font-weight:600;fill:currentColor}.fillsoft{fill:currentColor;opacity:.14}text.accf{fill:#A6512A;opacity:1}text.tlf{fill:#255C61;opacity:1}</style>
  <g font-family="IBM Plex Sans Condensed, sans-serif" font-size="12.5" fill="currentColor">
    <!-- axis -->
    <line x1="196" y1="34" x2="196" y2="272" stroke="currentColor" stroke-width="1.2"/>
    <g stroke="currentColor" stroke-width="0.6" opacity="0.28">
      <line x1="292" y1="34" x2="292" y2="272"/>
      <line x1="388" y1="34" x2="388" y2="272"/>
      <line x1="484" y1="34" x2="484" y2="272"/>
      <line x1="580" y1="34" x2="580" y2="272"/>
      <line x1="676" y1="34" x2="676" y2="272"/>
    </g>
    <g font-family="IBM Plex Mono, monospace" font-size="11" fill="currentColor" opacity="0.72" text-anchor="middle">
      <text x="196" y="290">0.01 pJ</text>
      <text x="292" y="290">0.1 pJ</text>
      <text x="388" y="290">1 pJ</text>
      <text x="484" y="290">10 pJ</text>
      <text x="580" y="290">100 pJ</text>
      <text x="676" y="290">1 nJ</text>
    </g>
    <text x="436" y="312" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" opacity="0.72">energy per operation, logarithmic</text>

    <!-- bars: x = 196 + 96*log10(pJ/0.01) -->
    <g>
      <rect x="196" y="44" width="46" height="20" fill="currentColor" opacity="0.35"/>
      <text x="188" y="59" text-anchor="end">int8 add · 0.03 pJ</text>
      <rect x="196" y="76" width="125" height="20" fill="currentColor" opacity="0.35"/>
      <text x="188" y="91" text-anchor="end">int8 multiply · 0.2 pJ</text>
      <rect x="196" y="108" width="192" height="20" fill="currentColor" opacity="0.35"/>
      <text x="188" y="123" text-anchor="end">fp32 multiply · 4 pJ</text>
      <rect x="196" y="140" width="292" height="20" fill="currentColor" opacity="0.5"/>
      <text x="188" y="155" text-anchor="end">32 kB SRAM read · 20 pJ</text>
      <rect x="196" y="172" width="388" height="20" fill="currentColor" opacity="0.5"/>
      <text x="188" y="187" text-anchor="end">1 MB cache read · 100 pJ</text>
      <rect x="196" y="204" width="500" height="20" class="accf"/>
      <text x="188" y="219" text-anchor="end">DRAM access · ~2 nJ</text>
      <rect x="196" y="236" width="510" height="20" class="accf" opacity="0.45"/>
      <text x="188" y="251" text-anchor="end">radio TX, same 32 bits</text>
    </g>
    <text x="8" y="22" font-family="IBM Plex Mono, monospace" font-size="11" opacity="0.72">45 nm reference values, after Horowitz (ISSCC 2014)</text>
    <text x="712" y="251" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="10.5" opacity="0.72">order 10²–10³ nJ, protocol dependent</text>
  </g>
</svg>