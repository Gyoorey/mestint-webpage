  <text x="323.0" y="40.0" class="lbl" text-anchor="middle">if-branch</text>
  <text x="433.0" y="40.0" class="lbl" text-anchor="middle">else-branch</text>
  <text x="563.0" y="40.0" class="lbl" text-anchor="middle">reconverged</text>
  <line x1="270.0" y1="182.0" x2="486.0" y2="182.0" class="acc" stroke-width="2"/>
  <text x="378.0" y="198.0" class="lblb" text-anchor="middle" fill="var(--copper)">divergent region — both paths run, lanes masked</text>
  <text x="36.0" y="228.0" class="lbl">Faint cells are lanes that are switched off but still occupy their slot in time.</text>
  <text x="36.0" y="248.0" class="lbl">This is why unstructured sparsity, early exits and any data-dependent branch are expensive on a GPU —</text>
  <text x="36.0" y="264.0" class="lbl">and why N:M sparsity, whose pattern is fixed at compile time, is not.</text>
</svg>