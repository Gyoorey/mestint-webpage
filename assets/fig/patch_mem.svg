<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Per-layer peak activation memory profile of a convolutional network, showing a tall spike in the first few layers, with a dashed SRAM limit line crossed only by that spike, and a second panel showing patch-based execution keeping the spike below the limit at the cost of halo recomputation"><style>text{fill:#14181A}svg{color:#14181A;font-family:"IBM Plex Sans Condensed",Arial,sans-serif}.acc{stroke:#A6512A;fill:none}.accf{fill:#A6512A}.tl{stroke:#255C61;fill:none}.tlf{fill:#255C61}.ax{stroke:currentColor;stroke-width:1.1;fill:none}.grid{stroke:currentColor;stroke-width:.6;opacity:.22;fill:none}.ser{fill:none;stroke:currentColor;stroke-width:1.8}.lbl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;fill:currentColor;opacity:.75}.lblb{font-family:"IBM Plex Sans Condensed",Arial,sans-serif;font-size:12px;font-weight:600;fill:currentColor}.fillsoft{fill:currentColor;opacity:.14}text.accf{fill:#A6512A;opacity:1}text.tlf{fill:#255C61;opacity:1}</style>
  <g font-family="IBM Plex Sans Condensed, sans-serif" font-size="11.5" fill="currentColor">
    <text x="8" y="18" font-family="IBM Plex Mono, monospace" font-size="11" opacity="0.78">per-layer peak activation memory — the shape that constrains everything</text>
    <line x1="46" y1="168" x2="700" y2="168" stroke="currentColor" stroke-width="1.1"/>
    <line x1="46" y1="34" x2="46" y2="168" stroke="currentColor" stroke-width="1.1"/>
    <g fill="currentColor" opacity="0.32">
      <rect x="56" y="44" width="34" height="124"/><rect x="94" y="58" width="34" height="110"/>
      <rect x="132" y="92" width="34" height="76"/><rect x="170" y="116" width="34" height="52"/>
      <rect x="208" y="130" width="34" height="38"/><rect x="246" y="138" width="34" height="30"/>
      <rect x="284" y="142" width="34" height="26"/><rect x="322" y="146" width="34" height="22"/>
      <rect x="360" y="148" width="34" height="20"/><rect x="398" y="150" width="34" height="18"/>
      <rect x="436" y="151" width="34" height="17"/><rect x="474" y="152" width="34" height="16"/>
      <rect x="512" y="152" width="34" height="16"/><rect x="550" y="153" width="34" height="15"/>
      <rect x="588" y="153" width="34" height="15"/><rect x="626" y="154" width="34" height="14"/>
    </g>
    <line x1="46" y1="104" x2="700" y2="104" class="acc" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="700" y="98" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="11" class="accf">SRAM limit</text>
    <text x="120" y="34" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" class="accf">only these layers do not fit</text>
    <text x="373" y="188" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" opacity="0.78">layer index  →</text>

    <line x1="20" y1="206" x2="700" y2="206" stroke="currentColor" stroke-width="1" opacity="0.35"/>
    <text x="8" y="228" font-family="IBM Plex Sans Condensed, sans-serif" font-size="12.5" font-weight="600">Patch-based inference: run the early layers on spatial tiles, keeping only one patch plus its halo live.</text>
    <g stroke="currentColor" stroke-width="1.1" fill="none">
      <rect x="46" y="240" width="120" height="44"/>
      <line x1="86" y1="240" x2="86" y2="284"/><line x1="126" y1="240" x2="126" y2="284"/>
      <line x1="46" y1="255" x2="166" y2="255"/><line x1="46" y1="270" x2="166" y2="270"/>
    </g>
    <rect x="86" y="255" width="40" height="15" class="tlf" opacity="0.45"/>
    <rect x="78" y="249" width="56" height="27" fill="none" class="acc" stroke-width="1.4"/>
    <text x="182" y="252" font-family="IBM Plex Mono, monospace" font-size="10.5" class="tlf">one patch</text>
    <text x="182" y="268" font-family="IBM Plex Mono, monospace" font-size="10.5" class="accf">+ halo the convolutions need</text>
    <text x="390" y="252" font-family="IBM Plex Mono, monospace" opacity="0.85" font-size="10.22">peak memory ↓ 4–8× · overlapping halos are recomputed</text>
    <text x="390" y="270" font-family="IBM Plex Mono, monospace" opacity="0.85" font-size="6.78">redistributing the receptive field shrinks the halo, recovering most of the cost</text>
  </g>
</svg>