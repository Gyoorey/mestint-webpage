<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="Blocked matrix multiplication: a tile of A and a tile of B are loaded into fast memory and used to compute a tile of C, with the reuse factor annotated"><style>text{fill:#14181A}svg{color:#14181A;font-family:"IBM Plex Sans Condensed",Arial,sans-serif}.acc{stroke:#A6512A;fill:none}.accf{fill:#A6512A}.tl{stroke:#255C61;fill:none}.tlf{fill:#255C61}.ax{stroke:currentColor;stroke-width:1.1;fill:none}.grid{stroke:currentColor;stroke-width:.6;opacity:.22;fill:none}.ser{fill:none;stroke:currentColor;stroke-width:1.8}.lbl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;fill:currentColor;opacity:.75}.lblb{font-family:"IBM Plex Sans Condensed",Arial,sans-serif;font-size:12px;font-weight:600;fill:currentColor}.fillsoft{fill:currentColor;opacity:.14}text.accf{fill:#A6512A;opacity:1}text.tlf{fill:#255C61;opacity:1}</style>
  <g font-family="IBM Plex Sans Condensed, sans-serif" font-size="12" fill="currentColor">
    <!-- A -->
    <rect x="30" y="60" width="150" height="150" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <g stroke="currentColor" stroke-width="0.6" opacity="0.35">
      <line x1="30" y1="110" x2="180" y2="110"/><line x1="30" y1="160" x2="180" y2="160"/>
      <line x1="80" y1="60" x2="80" y2="210"/><line x1="130" y1="60" x2="130" y2="210"/>
    </g>
    <rect x="80" y="110" width="50" height="50" class="accf" opacity="0.4"/>
    <text x="105" y="48" text-anchor="middle" font-weight="600">A (m×k)</text>
    <text x="105" y="228" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" opacity="0.78">tile b×b</text>
    <text x="196" y="140" text-anchor="middle" font-size="18">×</text>
    <!-- B -->
    <rect x="212" y="60" width="150" height="150" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <g stroke="currentColor" stroke-width="0.6" opacity="0.35">
      <line x1="212" y1="110" x2="362" y2="110"/><line x1="212" y1="160" x2="362" y2="160"/>
      <line x1="262" y1="60" x2="262" y2="210"/><line x1="312" y1="60" x2="312" y2="210"/>
    </g>
    <rect x="262" y="110" width="50" height="50" class="tlf" opacity="0.4"/>
    <text x="287" y="48" text-anchor="middle" font-weight="600">B (k×n)</text>
    <text x="378" y="140" text-anchor="middle" font-size="18">=</text>
    <!-- C -->
    <rect x="394" y="60" width="150" height="150" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <g stroke="currentColor" stroke-width="0.6" opacity="0.35">
      <line x1="394" y1="110" x2="544" y2="110"/><line x1="394" y1="160" x2="544" y2="160"/>
      <line x1="444" y1="60" x2="444" y2="210"/><line x1="494" y1="60" x2="494" y2="210"/>
    </g>
    <rect x="444" y="110" width="50" height="50" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="469" y="48" text-anchor="middle" font-weight="600">C (m×n)</text>
    <!-- annotation -->
    <g stroke="currentColor" stroke-width="1" fill="none" opacity="0.7">
      <path d="M105 236 L105 246 L469 246 L469 176" stroke-dasharray="4 3"/>
    </g>
    <text x="600" y="86" font-family="IBM Plex Mono, monospace" font-size="11" opacity="0.85">loaded once:</text>
    <text x="600" y="104" font-family="IBM Plex Mono, monospace" font-size="11" opacity="0.85">2b² elements</text>
    <text x="600" y="130" font-family="IBM Plex Mono, monospace" font-size="11" opacity="0.85">work done:</text>
    <text x="600" y="148" font-family="IBM Plex Mono, monospace" font-size="11" opacity="0.85">b³ MACs</text>
    <text x="600" y="176" font-family="IBM Plex Mono, monospace" class="accf" font-size="10.7">reuse factor = b/2</text>
    <text x="600" y="200" font-family="IBM Plex Mono, monospace" opacity="0.78" font-size="7.71">bigger tile → more reuse,</text>
    <text x="600" y="214" font-family="IBM Plex Mono, monospace" opacity="0.78" font-size="8.76">until it stops fitting</text>
  </g>
</svg>