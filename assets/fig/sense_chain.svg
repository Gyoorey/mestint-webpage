<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="Block diagram of the embedded sensing chain from physical quantity through transducer, amplifier, anti-alias filter, sample-and-hold, quantizer, digital filtering, framing and feature extraction to the model, annotated with what each stage loses"><style>text{fill:#14181A}svg{color:#14181A;font-family:"IBM Plex Sans Condensed",Arial,sans-serif}.acc{stroke:#A6512A;fill:none}.accf{fill:#A6512A}.tl{stroke:#255C61;fill:none}.tlf{fill:#255C61}.ax{stroke:currentColor;stroke-width:1.1;fill:none}.grid{stroke:currentColor;stroke-width:.6;opacity:.22;fill:none}.ser{fill:none;stroke:currentColor;stroke-width:1.8}.lbl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;fill:currentColor;opacity:.75}.lblb{font-family:"IBM Plex Sans Condensed",Arial,sans-serif;font-size:12px;font-weight:600;fill:currentColor}.fillsoft{fill:currentColor;opacity:.14}text.accf{fill:#A6512A;opacity:1}text.tlf{fill:#255C61;opacity:1}</style>
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g font-family="IBM Plex Sans Condensed, sans-serif" font-size="12" fill="currentColor">
    <g stroke="currentColor" stroke-width="1.2" fill="none">
      <rect x="6" y="52" width="82" height="44"/>
      <rect x="104" y="52" width="82" height="44"/>
      <rect x="202" y="52" width="82" height="44"/>
      <rect x="300" y="52" width="82" height="44"/>
      <rect x="398" y="52" width="82" height="44"/>
      <rect x="496" y="52" width="94" height="44"/>
      <rect x="606" y="52" width="108" height="44"/>
    </g>
    <g text-anchor="middle" font-weight="600">
      <text x="47" y="70">transducer</text><text x="47" y="85">+ bias</text>
      <text x="145" y="70">amplifier</text><text x="145" y="85">/ AGC</text>
      <text x="243" y="70">anti-alias</text><text x="243" y="85">filter</text>
      <text x="341" y="70">sample</text><text x="341" y="85">&amp; hold</text>
      <text x="439" y="70">quantizer</text><text x="439" y="85">N bits</text>
      <text x="543" y="70">digital filter</text><text x="543" y="85">+ decimate</text>
      <text x="660" y="70">frame, window,</text><text x="660" y="85">features</text>
    </g>
    <g stroke="currentColor" stroke-width="1.2" marker-end="url(#ar2)">
      <line x1="88" y1="74" x2="100" y2="74"/><line x1="186" y1="74" x2="198" y2="74"/>
      <line x1="284" y1="74" x2="296" y2="74"/><line x1="382" y1="74" x2="394" y2="74"/>
      <line x1="480" y1="74" x2="492" y2="74"/><line x1="590" y1="74" x2="602" y2="74"/>
    </g>
    <line x1="6" y1="30" x2="290" y2="30" stroke="currentColor" stroke-width="1" opacity="0.5"/>
    <line x1="300" y1="30" x2="714" y2="30" stroke="currentColor" stroke-width="1" opacity="0.5"/>
    <text x="148" y="24" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" opacity="0.75">continuous time — analog domain</text>
    <text x="507" y="24" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" opacity="0.75">discrete time — digital domain</text>
    <g font-family="IBM Plex Mono, monospace" font-size="10.5" class="accf" text-anchor="middle">
      <text x="47" y="120">thermal +</text><text x="47" y="133">1/f noise</text>
      <text x="145" y="120">clipping,</text><text x="145" y="133">distortion</text>
      <text x="243" y="120">band above</text><text x="243" y="133">f_s/2 (wanted)</text>
      <text x="341" y="120">jitter →</text><text x="341" y="133">phase noise</text>
      <text x="439" y="120">q²/12</text><text x="439" y="133">noise power</text>
      <text x="543" y="120">transition</text><text x="543" y="133">band ripple</text>
      <text x="660" y="120">time/frequency</text><text x="660" y="133">resolution</text>
    </g>
    <text x="360" y="168" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" opacity="0.75">every red annotation is information the model can never recover</text>
  </g>
</svg>