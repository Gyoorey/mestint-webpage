  <text x="66.0" y="26.0" class="lbl">schematic shapes — the crossover position is what matters, not the exact values</text>
  <text x="490.0" y="80.0" class="lbl">Unstructured keeps</text>
  <text x="490.0" y="95.0" class="lbl">accuracy longer;</text>
  <text x="490.0" y="118.0" class="lbl">structured is what</text>
  <text x="490.0" y="133.0" class="lbl">makes the device</text>
  <text x="490.0" y="148.0" class="lbl">faster.</text>
  <text x="66.0" y="284.0" class="lblb">Below 50 % sparsity in int8, unstructured pruning makes the model bigger and no faster.</text>
