<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Log-log scatter of embedded ML applications by raw sensor data rate and typical model compute per inference, from temperature anomaly detection at a few bytes per second to video object detection at hundreds of megabytes per second"><style>text{fill:#14181A}svg{color:#14181A;font-family:"IBM Plex Sans Condensed",Arial,sans-serif}.acc{stroke:#A6512A;fill:none}.accf{fill:#A6512A}.tl{stroke:#255C61;fill:none}.tlf{fill:#255C61}.ax{stroke:currentColor;stroke-width:1.1;fill:none}.grid{stroke:currentColor;stroke-width:.6;opacity:.22;fill:none}.ser{fill:none;stroke:currentColor;stroke-width:1.8}.lbl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;fill:currentColor;opacity:.75}.lblb{font-family:"IBM Plex Sans Condensed",Arial,sans-serif;font-size:12px;font-weight:600;fill:currentColor}.fillsoft{fill:currentColor;opacity:.14}text.accf{fill:#A6512A;opacity:1}text.tlf{fill:#255C61;opacity:1}</style>
  <line x1="84.0" y1="270.0" x2="540.0" y2="270.0" class="ax"/>
  <line x1="84.0" y1="30.0" x2="84.0" y2="270.0" class="ax"/>
  <line x1="84.0" y1="30.0" x2="84.0" y2="270.0" class="grid"/>
  <line x1="84.0" y1="270.0" x2="84.0" y2="274.0" class="ax"/>
  <text x="84.0" y="286.0" class="lbl" text-anchor="middle">1 B/s</text>
  <line x1="236.0" y1="30.0" x2="236.0" y2="270.0" class="grid"/>
  <line x1="236.0" y1="270.0" x2="236.0" y2="274.0" class="ax"/>
  <text x="236.0" y="286.0" class="lbl" text-anchor="middle">1 kB/s</text>
  <line x1="388.0" y1="30.0" x2="388.0" y2="270.0" class="grid"/>
  <line x1="388.0" y1="270.0" x2="388.0" y2="274.0" class="ax"/>
  <text x="388.0" y="286.0" class="lbl" text-anchor="middle">1 MB/s</text>
  <line x1="540.0" y1="30.0" x2="540.0" y2="270.0" class="grid"/>
  <line x1="540.0" y1="270.0" x2="540.0" y2="274.0" class="ax"/>
  <text x="540.0" y="286.0" class="lbl" text-anchor="middle">1 GB/s</text>
  <line x1="84.0" y1="270.0" x2="540.0" y2="270.0" class="grid"/>
  <line x1="80.0" y1="270.0" x2="84.0" y2="270.0" class="ax"/>
  <text x="77.0" y="273.6" class="lbl" text-anchor="end">10²</text>
  <line x1="84.0" y1="210.0" x2="540.0" y2="210.0" class="grid"/>
  <line x1="80.0" y1="210.0" x2="84.0" y2="210.0" class="ax"/>
  <text x="77.0" y="213.6" class="lbl" text-anchor="end">10⁴</text>
  <line x1="84.0" y1="150.0" x2="540.0" y2="150.0" class="grid"/>
  <line x1="80.0" y1="150.0" x2="84.0" y2="150.0" class="ax"/>
  <text x="77.0" y="153.6" class="lbl" text-anchor="end">10⁶</text>
  <line x1="84.0" y1="90.0" x2="540.0" y2="90.0" class="grid"/>
  <line x1="80.0" y1="90.0" x2="84.0" y2="90.0" class="ax"/>
  <text x="77.0" y="93.6" class="lbl" text-anchor="end">10⁸</text>
  <line x1="84.0" y1="30.0" x2="540.0" y2="30.0" class="grid"/>
  <line x1="80.0" y1="30.0" x2="84.0" y2="30.0" class="ax"/>
  <text x="77.0" y="33.6" class="lbl" text-anchor="end">10¹⁰</text>
  <text x="312.0" y="303.0" class="lbl" text-anchor="middle">raw sensor data rate (log)</text>
  <text x="40.0" y="150.0" class="lbl" text-anchor="middle" transform="rotate(-90 40.0 150.0)">MACs per inference (log)</text>
  <rect x="84.0" y="105.7" width="456.0" height="164.3" class="fillsoft"/>
  <text x="534.0" y="262.0" class="lbl" text-anchor="end">typical microcontroller territory</text>
  <circle cx="99.3" cy="255.7" r="4.2" class="accf"/>
  <text x="107.3" y="259.7" class="lbl">temperature anomaly</text>
  <circle cx="240.0" cy="180.0" r="4.2" class="accf"/>
  <text x="248.0" y="184.0" class="lbl">IMU gesture / activity</text>
  <circle cx="215.8" cy="144.7" r="4.2" class="accf"/>
  <text x="207.8" y="148.7" class="lbl" text-anchor="end">ECG arrhythmia</text>
  <circle cx="301.9" cy="167.6" r="4.2" class="accf"/>
  <text x="309.9" y="171.6" class="lbl">vibration anomaly (AE)</text>
  <circle cx="312.3" cy="137.1" r="4.2" class="accf"/>
  <text x="320.3" y="141.1" class="lbl">keyword spotting (DS-CNN)</text>
  <circle cx="284.8" cy="123.7" r="4.2" class="accf"/>
  <text x="276.8" y="127.7" class="lbl" text-anchor="end">person detection 96×96</text>
  <circle cx="430.5" cy="41.9" r="4.2" class="tlf"/>
  <text x="422.5" y="45.9" class="lbl" text-anchor="end">object detection, VGA video</text>
  <circle cx="503.5" cy="54.7" r="4.2" class="tlf"/>
  <text x="495.5" y="58.7" class="lbl" text-anchor="end">1080p segmentation</text>
  <text x="560.0" y="60.0" class="lblb">Read across:</text>
  <text x="560.0" y="78.0" class="lbl">data rate decides</text>
  <text x="560.0" y="92.0" class="lbl">whether streaming raw</text>
  <text x="560.0" y="106.0" class="lbl">data off the device is</text>
  <text x="560.0" y="120.0" class="lbl">even possible.</text>
  <text x="560.0" y="150.0" class="lblb">Read up:</text>
  <text x="560.0" y="168.0" class="lbl">compute decides which</text>
  <text x="560.0" y="182.0" class="lbl">device class can run</text>
  <text x="560.0" y="196.0" class="lbl">the model at all.</text>
  <text x="84.0" y="334.0" class="lbl">Illustrative placement. KWS, person detection and anomaly detection use</text>
  <text x="84.0" y="348.0" class="lbl">the MLPerf Tiny reference models; the others are typical published sizes.</text>
</svg>