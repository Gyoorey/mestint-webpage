  <text x="360.0" y="247.0" class="lblb" text-anchor="middle">Session 5 — student presentations: one landmark paper each, four topic areas</text>
  <text x="360.0" y="262.0" class="lbl" text-anchor="middle">quantization · pruning &amp; distillation · efficient architectures &amp; NAS · TinyML systems &amp; hardware</text>
