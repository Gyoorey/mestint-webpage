  <text x="374.0" y="59.0" class="lbl accf">SESSION 3</text>
  <text x="374.0" y="88.0" class="lblb">Classical vs deep</text>
  <text x="374.0" y="104.0" class="lblb">models &amp; compression</text>
  <text x="376.0" y="130.0" class="lbl">· ML &amp; NN primer</text>
  <text x="376.0" y="148.0" class="lbl">· classical cost models</text>
  <text x="376.0" y="166.0" class="lbl">· efficient archs, NAS</text>
