<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="Neural architecture search as a loop: a search strategy proposes an architecture from a search space, a performance estimator returns a quality estimate, and a hardware cost model returns a latency or memory estimate, both feeding back into the strategy"><style>text{fill:#14181A}svg{color:#14181A;font-family:"IBM Plex Sans Condensed",Arial,sans-serif}.acc{stroke:#A6512A;fill:none}.accf{fill:#A6512A}.tl{stroke:#255C61;fill:none}.tlf{fill:#255C61}.ax{stroke:currentColor;stroke-width:1.1;fill:none}.grid{stroke:currentColor;stroke-width:.6;opacity:.22;fill:none}.ser{fill:none;stroke:currentColor;stroke-width:1.8}.lbl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;fill:currentColor;opacity:.75}.lblb{font-family:"IBM Plex Sans Condensed",Arial,sans-serif;font-size:12px;font-weight:600;fill:currentColor}.fillsoft{fill:currentColor;opacity:.14}text.accf{fill:#A6512A;opacity:1}text.tlf{fill:#255C61;opacity:1}</style>
  <defs>
    <marker id="ar12b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g font-family="IBM Plex Sans Condensed, sans-serif" font-size="12" fill="currentColor">
    <rect x="20" y="80" width="150" height="64" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="95" y="104" text-anchor="middle" font-weight="600">Search space</text>
    <text x="95" y="120" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" opacity="0.78">what can be built</text>
    <text x="95" y="134" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" opacity="0.78">cell · macro · MCU-feasible</text>

    <rect x="240" y="80" width="160" height="64" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <text x="320" y="104" text-anchor="middle" font-weight="600">Search strategy</text>
    <text x="320" y="120" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" opacity="0.78">RL · evolution · gradient</text>
    <text x="320" y="134" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" opacity="0.78">random search (the baseline)</text>

    <rect x="470" y="24" width="230" height="56" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="585" y="46" text-anchor="middle" font-weight="600">Performance estimation</text>
    <text x="585" y="64" text-anchor="middle" font-family="IBM Plex Mono, monospace" opacity="0.78" font-size="9.24">supernet weight sharing · early stop · predictor</text>

    <rect x="470" y="144" width="230" height="56" fill="none" class="acc" stroke-width="1.6"/>
    <text x="585" y="166" text-anchor="middle" font-weight="600" class="accf">Hardware cost model</text>
    <text x="585" y="184" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" class="accf">measured latency LUT · SRAM · energy</text>

    <g stroke="currentColor" stroke-width="1.2" marker-end="url(#ar12b)">
      <line x1="170" y1="112" x2="236" y2="112"/>
      <line x1="400" y1="100" x2="466" y2="62"/>
      <line x1="400" y1="126" x2="466" y2="164"/>
    </g>
    <g stroke="currentColor" stroke-width="1.2" marker-end="url(#ar12b)" stroke-dasharray="4 3">
      <path d="M585 80 L585 96 L410 96" fill="none"/>
      <path d="M585 144 L585 128 L410 128" fill="none"/>
    </g>
    <text x="320" y="222" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="12.5" font-weight="600">The hardware box is what turns NAS into embedded ML.</text>
    <text x="320" y="240" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" opacity="0.8">Without it you get an accurate model; with it you get a deployable one.</text>
  </g>
</svg>