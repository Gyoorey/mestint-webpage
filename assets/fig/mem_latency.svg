  <text x="213.8" y="173.8" class="lblb">L2</text>
  <circle cx="241.4" cy="138.8" r="6.0" fill="currentColor" opacity="0.85"/>
  <text x="251.4" y="142.8" class="lblb">L3</text>
  <circle cx="298.6" cy="83.2" r="6.0" fill="currentColor" opacity="0.85"/>
  <text x="288.6" y="87.2" class="lblb" text-anchor="end">DRAM</text>
  <circle cx="485.7" cy="46.2" r="6.0" fill="currentColor" opacity="0.85"/>
  <text x="475.7" y="50.2" class="lblb" text-anchor="end">SSD</text>
  <circle cx="126.2" cy="188.2" r="6.0" class="accf" opacity="0.85"/>
  <text x="116.2" y="192.2" class="lblb" text-anchor="end" fill="var(--copper)">MCU TCM</text>
  <circle cx="160.5" cy="176.0" r="6.0" class="accf" opacity="0.85"/>
  <text x="150.5" y="180.0" class="lblb" text-anchor="end" fill="var(--copper)">MCU SRAM</text>
  <circle cx="232.4" cy="163.6" r="6.0" class="accf" opacity="0.85"/>
  <text x="242.4" y="167.6" class="lblb" fill="var(--copper)">MCU flash</text>
  <path d="M88.7 233.6 L298.6 83.2" class="grid" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="298.0" y="282.0" class="lbl" text-anchor="middle">access latency, in core cycles</text>
  <text x="32.0" y="143.0" class="lbl" text-anchor="middle" transform="rotate(-90 32.0 143.0)">capacity</text>
  <text x="76.0" y="26.0" class="lbl">big and fast is not a thing you can buy — it is a thing you arrange</text>
  <text x="528.0" y="92.0" class="lblb">Nothing here is a</text>
  <text x="528.0" y="108.0" class="lblb">surprise to a chip</text>
  <text x="528.0" y="124.0" class="lblb">designer. The point</text>
  <text x="528.0" y="140.0" class="lblb">is the slope:</text>
  <text x="528.0" y="168.0" class="lbl">1000× more capacity</text>
  <text x="528.0" y="184.0" class="lbl">costs roughly 1000×</text>
  <text x="528.0" y="200.0" class="lbl">more latency.</text>
  <text x="528.0" y="228.0" class="lbl" fill="var(--copper)">Tiling exists to keep</text>
  <text x="528.0" y="244.0" class="lbl" fill="var(--copper)">you at the bottom left.</text>
  <text x="76.0" y="296.0" class="lblb">On a CPU the hardware moves data up this ladder for you; on an MCU your linker script does.</text>
  <text x="76.0" y="316.0" class="lbl">Order-of-magnitude teaching values, not datasheet numbers.</text>
</svg>