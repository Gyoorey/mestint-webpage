  <text x="304.3" y="263.0" class="lbl" text-anchor="middle">300</text>
  <line x1="376.2" y1="40.0" x2="376.2" y2="246.0" class="grid"/>
  <line x1="376.2" y1="246.0" x2="376.2" y2="250.0" class="ax"/>
  <text x="376.2" y="263.0" class="lbl" text-anchor="middle">3 k</text>
  <line x1="448.1" y1="40.0" x2="448.1" y2="246.0" class="grid"/>
  <line x1="448.1" y1="246.0" x2="448.1" y2="250.0" class="ax"/>
  <text x="448.1" y="263.0" class="lbl" text-anchor="middle">30 k</text>
  <line x1="76.0" y1="225.4" x2="520.0" y2="225.4" class="grid"/>
  <line x1="72.0" y1="225.4" x2="76.0" y2="225.4" class="ax"/>
  <text x="68.0" y="229.0" class="lbl" text-anchor="end">1 kB</text>
  <line x1="76.0" y1="163.6" x2="520.0" y2="163.6" class="grid"/>
  <line x1="72.0" y1="163.6" x2="76.0" y2="163.6" class="ax"/>
  <text x="68.0" y="167.2" class="lbl" text-anchor="end">1 MB</text>
  <line x1="76.0" y1="101.8" x2="520.0" y2="101.8" class="grid"/>
  <line x1="72.0" y1="101.8" x2="76.0" y2="101.8" class="ax"/>
  <text x="68.0" y="105.4" class="lbl" text-anchor="end">1 GB</text>
  <line x1="76.0" y1="40.0" x2="520.0" y2="40.0" class="grid"/>
  <line x1="72.0" y1="40.0" x2="76.0" y2="40.0" class="ax"/>
  <text x="68.0" y="43.6" class="lbl" text-anchor="end">1 TB</text>
