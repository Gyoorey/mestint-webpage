  <text x="160.5" y="263.0" class="lbl" text-anchor="middle">3</text>
  <line x1="232.4" y1="40.0" x2="232.4" y2="246.0" class="grid"/>
  <line x1="232.4" y1="246.0" x2="232.4" y2="250.0" class="ax"/>
  <text x="232.4" y="263.0" class="lbl" text-anchor="middle">30</text>
  <line x1="304.3" y1="40.0" x2="304.3" y2="246.0" class="grid"/>
