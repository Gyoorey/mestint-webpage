<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="Standard convolution shown as one operation mixing space and channels, decomposed into a depthwise stage filtering each channel independently and a pointwise one-by-one stage mixing channels"><style>text{fill:#14181A}svg{color:#14181A;font-family:"IBM Plex Sans Condensed",Arial,sans-serif}.acc{stroke:#A6512A;fill:none}.accf{fill:#A6512A}.tl{stroke:#255C61;fill:none}.tlf{fill:#255C61}.ax{stroke:currentColor;stroke-width:1.1;fill:none}.grid{stroke:currentColor;stroke-width:.6;opacity:.22;fill:none}.ser{fill:none;stroke:currentColor;stroke-width:1.8}.lbl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;fill:currentColor;opacity:.75}.lblb{font-family:"IBM Plex Sans Condensed",Arial,sans-serif;font-size:12px;font-weight:600;fill:currentColor}.fillsoft{fill:currentColor;opacity:.14}text.accf{fill:#A6512A;opacity:1}text.tlf{fill:#255C61;opacity:1}</style>
  <defs>
    <marker id="ar5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g font-family="IBM Plex Sans Condensed, sans-serif" font-size="12" fill="currentColor">
    <text x="8" y="18" font-family="IBM Plex Mono, monospace" opacity="0.78" font-size="10.9">standard 3×3 conv — one kernel spans all inputs</text>
    <g stroke="currentColor" stroke-width="1.1" fill="none">
      <rect x="12" y="34" width="46" height="46"/><rect x="20" y="42" width="46" height="46"/><rect x="28" y="50" width="46" height="46"/>
    </g>
    <text x="51" y="112" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" opacity="0.78">C_in maps</text>
    <line x1="82" y1="66" x2="118" y2="66" stroke="currentColor" stroke-width="1.2" marker-end="url(#ar5)"/>
    <g class="acc" stroke-width="1.4" fill="none">
      <rect x="122" y="46" width="22" height="22"/><rect x="128" y="52" width="22" height="22"/><rect x="134" y="58" width="22" height="22"/>
    </g>
    <text x="139" y="100" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" class="accf">k×k×C_in</text>
    <line x1="166" y1="66" x2="202" y2="66" stroke="currentColor" stroke-width="1.2" marker-end="url(#ar5)"/>
    <g stroke="currentColor" stroke-width="1.1" fill="none">
      <rect x="206" y="34" width="46" height="46"/><rect x="214" y="42" width="46" height="46"/><rect x="222" y="50" width="46" height="46"/>
    </g>
    <text x="245" y="112" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" opacity="0.78">C_out maps</text>
    <text x="139" y="136" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11">H·W·k²·C_in·C_out MACs</text>

    <line x1="300" y1="24" x2="300" y2="230" stroke="currentColor" stroke-width="1" opacity="0.4" stroke-dasharray="4 4"/>

    <text x="322" y="18" font-family="IBM Plex Mono, monospace" opacity="0.78" font-size="10.9">depthwise separable — two cheaper stages</text>
    <g stroke="currentColor" stroke-width="1.1" fill="none">
      <rect x="326" y="34" width="42" height="42"/><rect x="333" y="41" width="42" height="42"/><rect x="340" y="48" width="42" height="42"/>
    </g>
    <line x1="390" y1="62" x2="418" y2="62" stroke="currentColor" stroke-width="1.2" marker-end="url(#ar5)"/>
    <g class="acc" stroke-width="1.4" fill="none">
      <rect x="422" y="42" width="18" height="18"/><rect x="428" y="48" width="18" height="18"/><rect x="434" y="54" width="18" height="18"/>
    </g>
    <text x="437" y="92" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" class="accf">k×k×1, one per channel</text>
    <line x1="462" y1="62" x2="490" y2="62" stroke="currentColor" stroke-width="1.2" marker-end="url(#ar5)"/>
    <g stroke="currentColor" stroke-width="1.1" fill="none">
      <rect x="494" y="34" width="42" height="42"/><rect x="501" y="41" width="42" height="42"/><rect x="508" y="48" width="42" height="42"/>
    </g>
    <line x1="558" y1="62" x2="586" y2="62" stroke="currentColor" stroke-width="1.2" marker-end="url(#ar5)"/>
    <g class="tl" stroke-width="1.6" fill="none">
      <rect x="590" y="52" width="10" height="10"/><rect x="596" y="58" width="10" height="10"/><rect x="602" y="64" width="10" height="10"/>
    </g>
    <text x="600" y="92" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" class="tlf">1×1×C_in</text>
    <line x1="620" y1="62" x2="648" y2="62" stroke="currentColor" stroke-width="1.2" marker-end="url(#ar5)"/>
    <g stroke="currentColor" stroke-width="1.1" fill="none">
      <rect x="652" y="34" width="42" height="42"/><rect x="659" y="41" width="42" height="42"/><rect x="666" y="48" width="42" height="42"/>
    </g>
    <text x="512" y="128" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11">H·W·k²·C_in + H·W·C_in·C_out MACs</text>
    <text x="512" y="146" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" class="accf">ratio = 1/C_out + 1/k² ≈ 1/9 for 3×3</text>

    <text x="360" y="196" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="12.5" font-weight="600">The arithmetic falls by ~9×. The bytes moved fall by far less — see the roofline.</text>
    <text x="360" y="220" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" opacity="0.78">this gap between counted work and measured time is the central lesson of the session</text>
  </g>
</svg>