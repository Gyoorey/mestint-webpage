<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Block diagram of a typical microcontroller used for embedded machine learning: a Cortex-M class core with FPU and SIMD extensions, on-chip flash and SRAM, DMA, a bus matrix, analog and digital peripherals, power management, and an optional neural processing unit, connected to sensors on the left and radio and actuators on the right"><style>text{fill:#14181A}svg{color:#14181A;font-family:"IBM Plex Sans Condensed",Arial,sans-serif}.acc{stroke:#A6512A;fill:none}.accf{fill:#A6512A}.tl{stroke:#255C61;fill:none}.tlf{fill:#255C61}.ax{stroke:currentColor;stroke-width:1.1;fill:none}.grid{stroke:currentColor;stroke-width:.6;opacity:.22;fill:none}.ser{fill:none;stroke:currentColor;stroke-width:1.8}.lbl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;fill:currentColor;opacity:.75}.lblb{font-family:"IBM Plex Sans Condensed",Arial,sans-serif;font-size:12px;font-weight:600;fill:currentColor}.fillsoft{fill:currentColor;opacity:.14}text.accf{fill:#A6512A;opacity:1}text.tlf{fill:#255C61;opacity:1}</style>
  <rect x="150.0" y="30.0" width="420.0" height="300.0" class="ax" fill="none" stroke-width="1.6"/>
  <text x="160.0" y="48.0" class="lbl">MICROCONTROLLER (single die, one package)</text>
  <rect x="170.0" y="62.0" width="150.0" height="92.0" class="fillsoft"/>
  <rect x="170.0" y="62.0" width="150.0" height="92.0" class="ax" fill="none"/>
  <text x="245.0" y="88.0" class="lblb" text-anchor="middle">CPU core</text>
  <text x="245.0" y="112.0" class="lbl" text-anchor="middle">Cortex-M4F / M7 / M55</text>
  <text x="245.0" y="126.0" class="lbl" text-anchor="middle">FPU, 2×16-bit SIMD</text>
  <text x="245.0" y="140.0" class="lbl" text-anchor="middle">48–480 MHz, no MMU</text>
  <rect x="340.0" y="62.0" width="210.0" height="92.0" class="acc" fill="none" stroke-dasharray="5 4" stroke-width="1.3"/>
  <text x="445.0" y="92.0" class="lblb" text-anchor="middle">optional NPU / ML accelerator</text>
  <text x="445.0" y="110.0" class="lbl" text-anchor="middle">e.g. Ethos-U55/U65 class</text>
  <text x="445.0" y="124.0" class="lbl" text-anchor="middle">32–256 int8 MAC per cycle</text>
  <text x="445.0" y="138.0" class="lbl" text-anchor="middle">shares the SRAM with the CPU</text>
  <rect x="170.0" y="166.0" width="380.0" height="20.0" class="fillsoft"/>
  <text x="360.0" y="180.0" class="lbl" text-anchor="middle">bus matrix (AHB/AXI) + DMA engines move data without the CPU</text>
  <rect x="170.0" y="198.0" width="120.0" height="60.0" class="ax" fill="none"/>
  <text x="230.0" y="217.0" class="lblb" text-anchor="middle">Flash / MRAM</text>
  <text x="230.0" y="232.0" class="lblb" text-anchor="middle">0.25–4 MB</text>
  <text x="230.0" y="247.0" class="lbl" text-anchor="middle">weights, code</text>
  <rect x="300.0" y="198.0" width="120.0" height="60.0" class="ax" fill="none"/>
  <text x="360.0" y="217.0" class="lblb" text-anchor="middle">SRAM</text>
  <text x="360.0" y="232.0" class="lblb" text-anchor="middle">64 kB – 3 MB</text>
  <text x="360.0" y="247.0" class="lbl" text-anchor="middle">activations</text>
  <rect x="430.0" y="198.0" width="120.0" height="60.0" class="ax" fill="none"/>
  <text x="490.0" y="224.5" class="lblb" text-anchor="middle">Power, clocks</text>
  <text x="490.0" y="239.5" class="lbl" text-anchor="middle">sleep, RTC</text>
  <rect x="170.0" y="268.0" width="380.0" height="46.0" class="ax" fill="none"/>
  <text x="360.0" y="295.0" class="lbl" text-anchor="middle">ADC · PDM/I²S (mic) · I²C/SPI (IMU) · timers · UART · GPIO</text>
  <rect x="14.0" y="70.0" width="110.0" height="44.0" class="ax" fill="none"/>
  <text x="69.0" y="88.5" class="lblb" text-anchor="middle">microphone</text>
  <text x="69.0" y="103.5" class="lbl" text-anchor="middle">PDM, 16 kHz</text>
  <line x1="124.0" y1="92.0" x2="168.0" y2="291.0" class="grid"/>
  <rect x="14.0" y="132.0" width="110.0" height="44.0" class="ax" fill="none"/>
  <text x="69.0" y="150.5" class="lblb" text-anchor="middle">IMU</text>
  <text x="69.0" y="165.5" class="lbl" text-anchor="middle">I²C/SPI, 100 Hz</text>
  <line x1="124.0" y1="154.0" x2="168.0" y2="291.0" class="grid"/>
  <rect x="14.0" y="194.0" width="110.0" height="44.0" class="ax" fill="none"/>
  <text x="69.0" y="212.5" class="lblb" text-anchor="middle">ECG / analog</text>
  <text x="69.0" y="227.5" class="lbl" text-anchor="middle">ADC, 250 Hz</text>
  <line x1="124.0" y1="216.0" x2="168.0" y2="291.0" class="grid"/>
  <rect x="14.0" y="256.0" width="110.0" height="44.0" class="ax" fill="none"/>
  <text x="69.0" y="274.5" class="lblb" text-anchor="middle">camera</text>
  <text x="69.0" y="289.5" class="lbl" text-anchor="middle">DCMI, low-res</text>
  <line x1="124.0" y1="278.0" x2="168.0" y2="291.0" class="grid"/>
  <text x="14.0" y="58.0" class="lbl">SENSORS</text>
  <text x="596.0" y="58.0" class="lbl">OUTPUTS</text>
  <rect x="596.0" y="70.0" width="112.0" height="44.0" class="ax" fill="none"/>
  <text x="652.0" y="88.5" class="lblb" text-anchor="middle">radio</text>
  <text x="652.0" y="103.5" class="lbl" text-anchor="middle">BLE, LoRa</text>
  <rect x="596.0" y="132.0" width="112.0" height="44.0" class="ax" fill="none"/>
  <text x="652.0" y="150.5" class="lblb" text-anchor="middle">actuators</text>
  <text x="652.0" y="165.5" class="lbl" text-anchor="middle">motor, LED</text>
  <rect x="596.0" y="194.0" width="112.0" height="44.0" class="ax" fill="none"/>
  <text x="652.0" y="212.5" class="lblb" text-anchor="middle">host / cloud</text>
  <text x="652.0" y="227.5" class="lbl" text-anchor="middle">rare, expensive</text>
  <line x1="552.0" y1="291.0" x2="594.0" y2="92.0" class="grid"/>
  <line x1="552.0" y1="291.0" x2="594.0" y2="154.0" class="grid"/>
  <line x1="552.0" y1="291.0" x2="594.0" y2="216.0" class="grid"/>
  <text x="360.0" y="350.0" class="lbl" text-anchor="middle">Typical figures, not a specific part — always read the datasheet of the device you have.</text>
</svg>