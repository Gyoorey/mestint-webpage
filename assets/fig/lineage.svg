<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Lineage diagram of the compression literature from 1990 to the present, showing how optimal brain damage, magnitude pruning, deep compression, integer-arithmetic-only quantization, adaptive rounding, learned step size, lottery tickets and MCUNet build on one another"><style>text{fill:#14181A}svg{color:#14181A;font-family:"IBM Plex Sans Condensed",Arial,sans-serif}.acc{stroke:#A6512A;fill:none}.accf{fill:#A6512A}.tl{stroke:#255C61;fill:none}.tlf{fill:#255C61}.ax{stroke:currentColor;stroke-width:1.1;fill:none}.grid{stroke:currentColor;stroke-width:.6;opacity:.22;fill:none}.ser{fill:none;stroke:currentColor;stroke-width:1.8}.lbl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;fill:currentColor;opacity:.75}.lblb{font-family:"IBM Plex Sans Condensed",Arial,sans-serif;font-size:12px;font-weight:600;fill:currentColor}.fillsoft{fill:currentColor;opacity:.14}text.accf{fill:#A6512A;opacity:1}text.tlf{fill:#255C61;opacity:1}</style>
  <defs>
    <marker id="ar11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g font-family="IBM Plex Sans Condensed, sans-serif" font-size="11.5" fill="currentColor">
    <line x1="20" y1="272" x2="700" y2="272" stroke="currentColor" stroke-width="1.1"/>
    <g font-family="IBM Plex Mono, monospace" font-size="10.5" opacity="0.75" text-anchor="middle">
      <text x="60" y="290">1990</text><text x="200" y="290">2015</text><text x="330" y="290">2016</text>
      <text x="440" y="290">2018</text><text x="550" y="290">2019–20</text><text x="666" y="290">2021→</text>
    </g>
    <g stroke="currentColor" stroke-width="0.6" opacity="0.3">
      <line x1="60" y1="30" x2="60" y2="272"/><line x1="200" y1="30" x2="200" y2="272"/>
      <line x1="330" y1="30" x2="330" y2="272"/><line x1="440" y1="30" x2="440" y2="272"/>
      <line x1="550" y1="30" x2="550" y2="272"/><line x1="666" y1="30" x2="666" y2="272"/>
    </g>
    <!-- pruning lane -->
    <text x="8" y="52" font-family="IBM Plex Mono, monospace" font-size="10.5" opacity="0.75">pruning</text>
    <g stroke="currentColor" stroke-width="1.2" fill="none">
      <rect x="18" y="62" width="86" height="34"/><rect x="160" y="62" width="86" height="34"/>
      <rect x="500" y="62" width="102" height="34"/>
    </g>
    <g text-anchor="middle"><text x="61" y="76">Optimal Brain</text><text x="61" y="89">Damage</text>
      <text x="203" y="76">Learning W</text><text x="203" y="89">and connections</text>
      <text x="551" y="76">Lottery ticket</text><text x="551" y="89">hypothesis</text></g>
    <g stroke="currentColor" stroke-width="1.1" marker-end="url(#ar11)">
      <line x1="104" y1="79" x2="156" y2="79"/><line x1="246" y1="79" x2="496" y2="79"/>
    </g>
    <!-- pipeline lane -->
    <text x="8" y="132" font-family="IBM Plex Mono, monospace" font-size="10.5" opacity="0.75">pipelines</text>
    <g class="acc" stroke-width="1.4" fill="none"><rect x="286" y="142" width="90" height="34"/></g>
    <text x="331" y="156" text-anchor="middle" font-weight="600">Deep</text><text x="331" y="169" text-anchor="middle" font-weight="600">Compression</text>
    <g stroke="currentColor" stroke-width="1.1" marker-end="url(#ar11)">
      <line x1="203" y1="96" x2="310" y2="138"/>
      <line x1="376" y1="159" x2="600" y2="122"/>
    </g>
    <g stroke="currentColor" stroke-width="1.2" fill="none"><rect x="604" y="104" width="100" height="34"/></g>
    <text x="654" y="118" text-anchor="middle">MCUNet /</text><text x="654" y="131" text-anchor="middle">MCUNetV2</text>
    <!-- quantization lane -->
    <text x="8" y="206" font-family="IBM Plex Mono, monospace" font-size="10.5" opacity="0.75">quantization</text>
    <g stroke="currentColor" stroke-width="1.2" fill="none">
      <rect x="392" y="216" width="96" height="34"/><rect x="504" y="216" width="94" height="34"/>
      <rect x="612" y="216" width="92" height="34"/>
    </g>
    <g text-anchor="middle">
      <text x="440" y="230">Integer-only</text><text x="440" y="243">inference</text>
      <text x="551" y="230">AdaRound,</text><text x="551" y="243">LSQ, CLE</text>
      <text x="658" y="230">W4A8, LLM</text><text x="658" y="243">quantization</text>
    </g>
    <g stroke="currentColor" stroke-width="1.1" marker-end="url(#ar11)">
      <line x1="331" y1="176" x2="400" y2="212"/>
      <line x1="488" y1="233" x2="500" y2="233"/><line x1="598" y1="233" x2="608" y2="233"/>
      <line x1="598" y1="220" x2="640" y2="142"/>
    </g>
    <text x="360" y="24" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="12.5" font-weight="600">Three lanes, one converging pipeline — and one method that tried to do everything at once</text>
  </g>
</svg>