  <rect x="96.5" y="70.0" width="78.0" height="58.0" class="ax" fill="none"/>
  <text x="135.5" y="94.0" class="lblb" text-anchor="middle">Collect &amp;</text>
  <text x="135.5" y="110.0" class="lbl" text-anchor="middle">label data</text>
  <text x="135.5" y="144.0" class="lbl accf" text-anchor="middle">S2</text>
  <line x1="175.5" y1="99.0" x2="184.0" y2="99.0" class="ax"/>
