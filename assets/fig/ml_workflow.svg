  <text x="224.0" y="94.0" class="lblb" text-anchor="middle">Preprocess,</text>
  <text x="224.0" y="110.0" class="lbl" text-anchor="middle">features</text>
  <text x="224.0" y="144.0" class="lbl accf" text-anchor="middle">S2</text>
  <line x1="264.0" y1="99.0" x2="272.5" y2="99.0" class="ax"/>
  <path d="M272.5 99.0 L268.0 101.3 L268.0 96.7 Z" fill="currentColor"/>
  <rect x="273.5" y="70.0" width="78.0" height="58.0" class="ax" fill="none"/>
  <text x="312.5" y="94.0" class="lblb" text-anchor="middle">Train</text>
  <text x="312.5" y="110.0" class="lbl" text-anchor="middle">model</text>
  <text x="312.5" y="144.0" class="lbl accf" text-anchor="middle">S3</text>
  <line x1="352.5" y1="99.0" x2="361.0" y2="99.0" class="ax"/>
