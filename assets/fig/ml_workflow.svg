  <path d="M578.0 66 L578.0 40 L312.5 40 L312.5 62" class="tl" stroke-width="1.4" stroke-dasharray="5 3"/>
  <line x1="312.5" y1="52.0" x2="312.5" y2="64.0" class="tl"/>
  <path d="M312.5 64.0 L309.8 58.7 L315.2 58.7 Z" class="tlf"/>
  <text x="445.2" y="33.0" class="lbl" text-anchor="middle">inner loop: does it fit, is it fast enough, is it still accurate?</text>
  <text x="8.0" y="232.0" class="lblb">Most of the effort in an embedded project sits in the two loops, not in the single "train" box.</text>
  <text x="8.0" y="250.0" class="lbl">S1–S4 mark the session in which each step is treated.</text>
</svg>