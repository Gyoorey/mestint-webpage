<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="A real-valued number line mapped onto integer levels, showing scale as the spacing between levels, the zero point aligned to integer zero, clipping outside the range, and the resulting uniform error band"><style>text{fill:#14181A}svg{color:#14181A;font-family:"IBM Plex Sans Condensed",Arial,sans-serif}.acc{stroke:#A6512A;fill:none}.accf{fill:#A6512A}.tl{stroke:#255C61;fill:none}.tlf{fill:#255C61}.ax{stroke:currentColor;stroke-width:1.1;fill:none}.grid{stroke:currentColor;stroke-width:.6;opacity:.22;fill:none}.ser{fill:none;stroke:currentColor;stroke-width:1.8}.lbl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;fill:currentColor;opacity:.75}.lblb{font-family:"IBM Plex Sans Condensed",Arial,sans-serif;font-size:12px;font-weight:600;fill:currentColor}.fillsoft{fill:currentColor;opacity:.14}text.accf{fill:#A6512A;opacity:1}text.tlf{fill:#255C61;opacity:1}</style>
  <g font-family="IBM Plex Sans Condensed, sans-serif" font-size="12" fill="currentColor">
    <text x="8" y="18" font-family="IBM Plex Mono, monospace" font-size="11" opacity="0.78">real axis — a weight distribution with its chosen clipping range</text>
    <!-- distribution -->
    <path d="M120 108 C 200 108, 230 40, 330 40 C 430 40, 460 108, 600 108" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.55"/>
    <line x1="40" y1="108" x2="690" y2="108" stroke="currentColor" stroke-width="1.2"/>
    <g class="acc" stroke-width="1.4" stroke-dasharray="4 3">
      <line x1="150" y1="34" x2="150" y2="120"/><line x1="560" y1="34" x2="560" y2="120"/>
    </g>
    <text x="150" y="30" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" class="accf">α</text>
    <text x="560" y="30" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" class="accf">β</text>
    <text x="88" y="126" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" opacity="0.75">clipped</text>
    <text x="628" y="126" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" opacity="0.75">clipped</text>
    <!-- levels -->
    <g stroke="currentColor" stroke-width="1" opacity="0.8">
      <line x1="150" y1="150" x2="150" y2="168"/><line x1="191" y1="150" x2="191" y2="168"/>
      <line x1="232" y1="150" x2="232" y2="168"/><line x1="273" y1="150" x2="273" y2="168"/>
      <line x1="314" y1="150" x2="314" y2="168"/><line x1="355" y1="150" x2="355" y2="168"/>
      <line x1="396" y1="150" x2="396" y2="168"/><line x1="437" y1="150" x2="437" y2="168"/>
      <line x1="478" y1="150" x2="478" y2="168"/><line x1="519" y1="150" x2="519" y2="168"/>
      <line x1="560" y1="150" x2="560" y2="168"/>
    </g>
    <line x1="40" y1="168" x2="690" y2="168" stroke="currentColor" stroke-width="1.2"/>
    <line x1="273" y1="144" x2="273" y2="176" class="tl" stroke-width="2.4"/>
    <text x="273" y="140" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" class="tlf">z (real 0, exactly)</text>
    <g stroke="currentColor" stroke-width="1" marker-end="none">
      <line x1="150" y1="190" x2="191" y2="190"/>
      <line x1="150" y1="186" x2="150" y2="194"/><line x1="191" y1="186" x2="191" y2="194"/>
    </g>
    <text x="200" y="194" font-family="IBM Plex Mono, monospace" font-size="11">s — one integer step</text>
    <text x="8" y="162" font-family="IBM Plex Mono, monospace" font-size="11" opacity="0.78">int8 grid</text>
    <text x="360" y="226" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="12.5" font-weight="600">Two error sources, traded against each other by the choice of α and β:</text>
    <text x="360" y="244" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" opacity="0.8">wide range → small clipping error, large rounding error (s/2)  ·  narrow range → the reverse</text>
  </g>
</svg>