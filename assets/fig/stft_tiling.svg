      <rect x="400" y="126" width="148" height="10"/><rect x="548" y="126" width="148" height="10"/>
      <rect x="400" y="116" width="148" height="10"/><rect x="548" y="116" width="148" height="10"/>
      <rect x="400" y="106" width="148" height="10"/><rect x="548" y="106" width="148" height="10"/>
      <rect x="400" y="96" width="148" height="10"/><rect x="548" y="96" width="148" height="10"/>
      <rect x="400" y="86" width="148" height="10"/><rect x="548" y="86" width="148" height="10"/>
