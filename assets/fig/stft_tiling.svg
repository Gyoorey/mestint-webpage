    <rect x="400" y="126" width="148" height="10" class="accf" opacity="0.35"/>
    <text x="548" y="216" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" opacity="0.78">time</text>
    <text x="360" y="240" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" opacity="0.78">every tile has the same area — the window chooses its shape, not its size</text>
  </g>
</svg>